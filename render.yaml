services:
  - type: web
    name: simple-blog-platform
    runtime: docker
    repo: https://github.com/Washim-8/Simple-Blogging-Platform
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: blog-db
          property: connectionString

databases:
  - name: blog-db
    databaseName: blog_db
    user: blog_user
    plan: free
    version: "15"
